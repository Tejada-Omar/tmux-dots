bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal 'tmux-256color'
set -sa terminal-features ',alacritty:RGB:sixel'
set -sa terminal-overrides ',*-256color*:Tc'
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g allow-rename off
set -g history-limit 50000
set -g status-interval 2
set -g renumber-windows on
setw -g mode-keys vi
set -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK SSH_AUTH_SOCK"
set -g default-shell /usr/bin/fish
set -g display-time 0
set -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "#T"
# TODO: Use terminfo to detect unicode support
set -g automatic-rename-format "#{?#{==:#{pane_current_command},man},#{=/8/…:#{s/^.*(man .*).*/\\1/:pane_title}},#{pane_current_command}}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-C-h resize-pane -L
bind -n M-C-j resize-pane -D
bind -n M-C-k resize-pane -U
bind -n M-C-l resize-pane -R

bind M-c attach-session -c "#{pane_current_path}"

bind -T copy-mode-vi C-n send-keys -X next-prompt -o
bind -T copy-mode-vi C-p send-keys -X previous-prompt -o
bind -T copy-mode-vi m send-keys -X set-mark
bind -T copy-mode-vi "'" send-keys -X jump-to-mark

set set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'laktak/extrakto'

# tmux-resurrect
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# tmux-fzf
TMUX_FZF_OPTIONS='-w 60% -h 50%'

# laktak/extrakto
set -g @extrakto_grab_area 'window recent'

run -b '$HOME/.config/tmux/plugins/tpm/tpm'

set -g status on
set -g status-justify absolute-centre
set -g status-keys vi

set -g clock-mode-style 12
set -g pane-active-border-style "fg=blue"

set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=blue,fg=black,bold"
set -g status-left " [#S#{?session_grouped, G,}] #[bg=terminal,fg=blue,nobold,dim] | #[nodim]#{server_sessions}S #{session_attached}C"
set -g status-right "#[bg=terminal,fg=blue,nobold]#{?client_prefix, PREFIX |,}#{?window_linked,#{window_linked_sessions} Links |,} #{session_path} "

set -g mode-style "bg=blue,fg=black"
set -g message-style "bg=blue,fg=black"
set -g message-command-style "bg=yellow,fg=black"

setw -g window-status-separator "#[bg=terminal,fg=blue,nobold,dim] | #[default]"
setw -g window-status-style "bg=terminal,fg=blue,fill=terminal"
setw -g window-status-activity-style "underscore,fg=red"
setw -g window-status-format "#[nobold][#I] #W #F#[default]"
setw -g window-status-current-format "#[bg=blue,fg=black] [#I] #W #F #[default]"
