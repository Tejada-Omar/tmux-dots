bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal 'tmux-256color'
set -sa terminal-features ',alacritty:RGB'
set -sa terminal-features ',foot*:RGB:sixel'
set -sa terminal-overrides ',*-256color*:Tc'
set -sa terminal-overrides ',foot*:Tc'
set -sg escape-time 10

set -sg destroy-unattached keep-last
set -sg detach-on-destroy no-detached

set -g allow-passthrough on
set -g alternate-screen on

set -g repeat-time 1000
set -g focus-events on
set -g mouse on
set -g allow-rename off
set -g history-limit 50000
set -g status-interval 2
set -g renumber-windows on
setw -g mode-keys vi
set -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK SSH_AUTH_SOCK"
set -g default-shell /usr/bin/fish
set -g display-time 0

set -g aggressive-resize on
set -g window-size largest

set -g monitor-bell on
set -g visual-bell both
set -g bell-action other

set -g monitor-silence 0
set -g visual-silence both
set -g silence-action any

bind M-s {
  set -F monitor-silence '#{?#{==:#{monitor-silence},0},10,0}'
  ; display 'monitor-silence is now #{monitor-silence}'
}

set -g set-titles on
set -g allow-set-title on
# TODO: Use terminfo to detect unicode support
set -g automatic-rename-format "#{?#{==:#{pane_current_command},man},#{=/8/…:#{s/^.*(man .*).*/\\1/:pane_title}},#{pane_current_command}}"

bind g popup -d "#{pane_current_path}" -xC -yC -w90% -h90% -E lazygit
bind G popup -d "#{pane_current_path}" -xC -yC -w90% -h90% -E gitu

bind -r -n M-h select-pane -L
bind -r -n M-j select-pane -D
bind -r -n M-k select-pane -U
bind -r -n M-l select-pane -R
bind -r -n M-C-h resize-pane -L
bind -r -n M-C-j resize-pane -D
bind -r -n M-C-k resize-pane -U
bind -r -n M-C-l resize-pane -R

bind M-c attach-session -c "#{pane_current_path}"
bind M-C-c new-session -c "#{pane_current_path}"
bind M-\" split-window -c "#{pane_current_path}"
bind M-% split-window -h -c "#{pane_current_path}"
bind M-d confirm-before kill-session

bind -r -T copy-mode-vi C-n send-keys -X next-prompt -o
bind -r -T copy-mode-vi C-p send-keys -X previous-prompt -o
bind -T copy-mode-vi m send-keys -X set-mark
bind -T copy-mode-vi "'" send-keys -X jump-to-mark

set set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X copy-end-of-line

bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDrag3Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd3Pane send-keys -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'laktak/extrakto'

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-fzf
TMUX_FZF_OPTIONS='-w 95% -h 95% -m'
bind "W" run -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh"
bind "P" run -b "~/.config/tmux/plugins/tmux-fzf/scripts/pane.sh"
bind "S" run -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# tmux-fzf-url
set -g @fzf-url-history-limit '500'
set -g @fzf-url-fzf-options '-w 95% -h 95% -m -0 --no-preview'

# laktak/extrakto
set -g @extrakto_grab_area 'window 500'
set -g @extrakto_clip_tool_run "tmux_osc52"
set -g @extrakto_filter_order "word path all line"

run -b '$HOME/.config/tmux/plugins/tpm/tpm'

set -g status on
set -g status-justify left
set -g status-keys vi

set -g clock-mode-style 12
set -g pane-active-border-style "fg=blue"

set -g status-left-length 100
set -g status-right-length 100
set -g status-style "bg=terminal,fg=blue"
set -g status-left "#[bold][#S#{?session_grouped, G,}]#[default] | "
set -g status-right "#{?client_prefix, ^B | ,}#{?window_linked,#{window_linked_sessions} L | ,}#{s|/(.{2#})[^/]+|/\\1:#{d:session_path}}/#{b:session_path} | %-I:%M %p"

set -g mode-style "bg=blue,fg=black"
set -g message-style "bg=blue,fg=black"
set -g message-command-style "bg=yellow,fg=black"

setw -g window-status-separator "#[dim] | #[default]"
setw -g window-status-style "bg=terminal,fg=blue,fill=terminal"
setw -g window-status-bell-style "fg=red"
setw -g window-status-activity-style "dim"
setw -g window-status-format "[#I] #W #F"
setw -g window-status-current-format "#[bold,bg=blue,fg=black] [#I] #W #F #[default]"

set -g status-format[0] "#[align=left #{E:status-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]"

set -ag status-format[0] "#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist]"

set -ag status-format[0] "#[align=right #{E:status-style}]#[push-default]#{T;=/-#{status-right-length}:status-right}#[pop-default]"
